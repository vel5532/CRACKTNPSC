# ── docker-compose.yml ──────────────────────────────────────────────────────
# Run entire ExamIQ stack with one command:
#   docker-compose up -d
# ────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:
  # ── MongoDB Database ────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: examiq-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: examiq
      MONGO_INITDB_ROOT_PASSWORD: examiq_pass_2024
      MONGO_INITDB_DATABASE: examiq
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - examiq-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examiq-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://examiq:examiq_pass_2024@mongodb:27017/examiq?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-examiq_super_secret_change_in_production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - examiq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examiq-web
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - examiq-net

  # ── Nginx Reverse Proxy (Production) ───────────────────
  nginx:
    image: nginx:alpine
    container_name: examiq-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - examiq-net
    profiles:
      - production

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  examiq-net:
    driver: bridge
