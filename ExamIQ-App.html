<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #2a2a3a;
  --border2: #3a3a50;
  --text: #e8e8f0;
  --muted: #7070a0;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --accent3: #06b6d4;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f97316;
  --yellow: #eab308;
  --gold: #f59e0b;
}
.light {
  --bg: #f0f0f8;
  --surface: #ffffff;
  --surface2: #f5f5ff;
  --border: #e0e0f0;
  --border2: #d0d0e8;
  --text: #1a1a2e;
  --muted: #6060a0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,select,textarea{font-family:inherit}
button{font-family:inherit;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(124,58,237,.3)}50%{box-shadow:0 0 40px rgba(124,58,237,.6)}}
@keyframes countup{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.fade-up{animation:fadeUp .4s ease both}
.fade-in{animation:fadeIn .3s ease}
.pulse{animation:pulse 2s infinite}
.spin{animation:spin 1s linear infinite}
.glow{animation:glow 2s ease-in-out infinite}
.shimmer{
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  transition:all .2s;
}
.card:hover{border-color:var(--border2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;border-radius:12px;font-weight:700;font-size:14px;
  border:none;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
}
.tag-easy{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.tag-medium{background:rgba(234,179,8,.15);color:#eab308;border:1px solid rgba(234,179,8,.3)}
.tag-hard{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.input{
  width:100%;padding:10px 14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;color:var(--text);
  font-size:14px;outline:none;transition:border-color .2s;
}
.input:focus{border-color:var(--accent)}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .8s ease}
.mono{font-family:'JetBrains Mono',monospace}
.gradient-text{background:linear-gradient(135deg,var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(10,10,15,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 24px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
}
.light .nav{background:rgba(240,240,248,.9)}
.sidebar{
  width:220px;min-height:calc(100vh - 60px);
  background:var(--surface);border-right:1px solid var(--border);
  padding:20px 12px;position:sticky;top:60px;height:calc(100vh - 60px);
  overflow-y:auto;flex-shrink:0;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;
  transition:all .15s;color:var(--muted);border:none;background:transparent;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(124,58,237,.15);color:var(--accent2);border:1px solid rgba(124,58,237,.2)}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px;transition:all .3s;
}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,.15)}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 16px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.table td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--surface2)}
.donut-svg text{font-family:'Bricolage Grotesque',sans-serif}
.q-option{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-radius:12px;border:2px solid var(--border);cursor:pointer;
  transition:all .2s;background:var(--surface);
}
.q-option:hover{border-color:var(--accent);background:rgba(124,58,237,.05)}
.q-option.selected{border-color:var(--accent);background:rgba(124,58,237,.1)}
.q-option.correct{border-color:var(--green);background:rgba(16,185,129,.1)}
.q-option.wrong{border-color:var(--red);background:rgba(239,68,68,.1)}
.timer-critical{animation:pulse 1s infinite;color:var(--red)!important}
.palette-btn{
  width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;transition:all .15s;
}
.p-not-visited{background:var(--surface2);color:var(--muted)}
.p-answered{background:var(--green);color:#fff}
.p-marked{background:var(--orange);color:#fff}
.p-marked-answered{background:var(--accent);color:#fff}
.p-visited{background:rgba(239,68,68,.3);color:var(--red)}
.chart-bar{transition:height .8s ease}
/* Scrollable page content */
.page-content{flex:1;overflow-y:auto;padding:24px}
.app-layout{display:flex;min-height:calc(100vh - 60px)}
/* Upload zone */
.upload-zone{
  border:2px dashed var(--border);border-radius:16px;
  padding:48px;text-align:center;cursor:pointer;transition:all .3s;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(124,58,237,.05)}
/* Notification toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 20px;font-size:14px;font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.4);animation:fadeUp .3s ease;
  display:flex;align-items:center;gap:10px;
}
</style>

function Toast({msg,type="info",onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t)},[]);
  const icons={success:"✅",error:"❌",info:"ℹ️",warning:"⚠️"};
  const colors={success:"#10b981",error:"#ef4444",info:"#7c3aed",warning:"#f97316"};
  return <div className="toast" style={{borderLeft:`3px solid ${colors[type]}`}}>
    <span>{icons[type]}</span><span>{msg}</span>
    <button onClick={onClose} style={{background:"none",border:"none",color:"var(--muted)",marginLeft:8,fontSize:16}}>×</button>
  </div>;
}

function Spinner({size=20}) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" className="spin">
    <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" opacity=".2"/>
    <path d="M12 2a10 10 0 0110 10" stroke="var(--accent2)" strokeWidth="3" strokeLinecap="round"/>
  </svg>;
}

function DonutChart({pct,color,size=100,label}) {
  const r=38,cx=50,cy=50,circ=2*Math.PI*r;
  const dash=(pct/100)*circ;
  return <div style={{textAlign:"center"}}>
    <svg width={size} height={size} viewBox="0 0 100 100">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface2)" strokeWidth="8"/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={`${dash} ${circ}`} strokeDashoffset={circ/4} strokeLinecap="round"/>
      <text x="50" y="47" textAnchor="middle" dominantBaseline="middle" fill={color} fontSize="14" fontWeight="800">{pct}%</text>
      <text x="50" y="62" textAnchor="middle" fill="var(--muted)" fontSize="9">{label}</text>
    </svg>
  </div>;
}

function BarChart({data}) {
  const max=Math.max(...data.map(d=>d.value),1);
  return <div style={{display:"flex",alignItems:"flex-end",gap:8,height:120,padding:"0 4px"}}>
    {data.map((d,i)=>(
      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
        <div style={{fontSize:10,color:"var(--muted)",fontWeight:600}}>{d.value}%</div>
        <div style={{width:"100%",height:Math.max(8,(d.value/max)*90),borderRadius:"4px 4px 0 0",
          background:d.value>=70?"var(--green)":d.value>=50?"var(--yellow)":"var(--red)",
          transition:"height .8s ease"}}/>
        <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",lineHeight:1.2}}>{d.label}</div>
      </div>
    ))}
  </div>;
}

function ProgressRing({pct,color="#7c3aed",size=60}) {
  const r=24,circ=2*Math.PI*r,dash=(pct/100)*circ;
  return <svg width={size} height={size} viewBox="0 0 60 60">
    <circle cx="30" cy="30" r={r} fill="none" stroke="var(--surface2)" strokeWidth="5"/>
    <circle cx="30" cy="30" r={r} fill="none" stroke={color} strokeWidth="5"
      strokeDasharray={`${dash} ${circ}`} strokeDashoffset={circ/4} strokeLinecap="round"/>
    <text x="30" y="30" textAnchor="middle" dominantBaseline="middle" fill={color} fontSize="11" fontWeight="800">{pct}%</text>
  </svg>;
}

function StudentDashboard() {
  const {navigate,setActiveTest,user} = useApp();
  const tests = generateTests();
  const history = JSON.parse(localStorage.getItem("eiq_history")||"[]");
  const stats = useMemo(()=>{
    if(!history.length) return {total:0,avg:0,accuracy:0,streak:0};
    return {
      total:history.length,
      avg:Math.round(history.reduce((a,b)=>a+b.score,0)/history.length),
      accuracy:Math.round(history.reduce((a,b)=>a+b.accuracy,0)/history.length),
      streak:3,
    };
  },[history]);

  const topicAccuracy = [
    {label:"Polity",value:stats.accuracy?Math.round(stats.accuracy*0.8):40},
    {label:"History",value:stats.accuracy?Math.round(stats.accuracy*1.1):78},
    {label:"Science",value:stats.accuracy?Math.round(stats.accuracy*0.6):35},
    {label:"Geo",value:stats.accuracy?Math.round(stats.accuracy*0.9):62},
    {label:"Tamil",value:stats.accuracy?Math.round(stats.accuracy*1.2):85},
    {label:"Eco",value:stats.accuracy?Math.round(stats.accuracy*0.75):50},
  ].map(x=>({...x,value:Math.min(100,Math.max(0,x.value))}));

  const weak = topicAccuracy.filter(t=>t.value<50);
  const strong = topicAccuracy.filter(t=>t.value>=70);

  return <div style={{display:"flex",flexDirection:"column",gap:24,animation:"fadeUp .4s ease"}}>
    {/* Welcome + Quick stats */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:16}}>

        {i:"📝",l:"Tests Taken",v:stats.total,c:"#7c3aed",sub:"+2 this week"},
        {i:"⭐",l:"Avg Score",v:`${stats.avg}%`,c:"#06b6d4",sub:stats.avg>=60?"Above average":"Needs work"},
        {i:"🎯",l:"Accuracy",v:`${stats.accuracy}%`,c:"#10b981",sub:`${stats.accuracy>=60?"Good":"Improve"} performance`},
        {i:"🔥",l:"Day Streak",v:stats.streak,c:"#f97316",sub:"Keep it up!"},
      ].map(s=><div key={s.l} className="stat-card fade-up">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div style={{width:40,height:40,borderRadius:12,background:`${s.c}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{s.i}</div>
          <span style={{fontSize:11,color:"var(--muted)",textAlign:"right",lineHeight:1.4}}>{s.sub}</span>
        </div>
        <div style={{fontSize:30,fontWeight:800,color:s.c}}>{s.v}</div>
        <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>{s.l}</div>
      </div>)}
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:20}}>
      {/* Available Tests */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h2 style={{fontSize:18,fontWeight:800}}>Available Tests</h2>
          <button className="btn btn-ghost" onClick={()=>navigate("tests")} style={{fontSize:13}}>View all →</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {tests.map(t=><div key={t.id} className="card" style={{padding:18,cursor:"pointer"}}
            onClick={()=>{setActiveTest(t);navigate("exam")}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{fontSize:15,fontWeight:700}}>{t.name}</span>
                  <span className={`badge tag-${t.difficulty.toLowerCase()}`}>{t.difficulty}</span>
                </div>
                <div style={{fontSize:13,color:"var(--muted)",marginBottom:8}}>{t.subject}</div>
                <div style={{display:"flex",gap:16,fontSize:12,color:"var(--muted)"}}>
                  <span>❓ {t.questions.length} Qs</span>
                  <span>⏱️ {t.duration} min</span>
                  <span>👥 {t.totalAttempts.toLocaleString()} attempts</span>
                </div>
              </div>
              <button className="btn btn-primary" style={{padding:"8px 16px",fontSize:13}}>Start →</button>

        {/* Chapter accuracy chart */}

          <h3 style={{fontSize:15,fontWeight:700,marginBottom:4}}>📊 Chapter Accuracy</h3>

          <h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>🔍 Weak Area Detector</h3>
          {weak.length>0&&<>
            <p style={{fontSize:12,fontWeight:600,color:"var(--red)",marginBottom:8}}>⚠️ Needs attention</p>
            {weak.map(t=><div key={t.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"7px 10px",borderRadius:8,background:"rgba(239,68,68,.08)",marginBottom:6}}>

            <p style={{fontSize:12,fontWeight:600,color:"var(--green)",marginBottom:8,marginTop:10}}>💪 Your strengths</p>
            {strong.map(t=><div key={t.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"7px 10px",borderRadius:8,background:"rgba(16,185,129,.08)",marginBottom:6}}>
              <span style={{fontSize:13,fontWeight:600}}>{t.label}</span>
              <span style={{fontSize:12,fontWeight:700,color:"var(--green)"}}>{t.value}%</span>
            </div>)}
          </>}

        {/* Recommended practice */}
        <div className="card" style={{padding:20,background:"linear-gradient(135deg,rgba(124,58,237,.15),rgba(6,182,212,.1))",border:"1px solid rgba(124,58,237,.3)"}}>
          <div style={{fontSize:24,marginBottom:8}}>🧠</div>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:4}}>Recommended Today</h3>
          <p style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Based on your weak areas</p>
          <button className="btn btn-primary" style={{width:"100%",fontSize:13}} onClick={()=>navigate("practice")}>
            Practice Now →
          </button>
        </div>
      </div>
    </div>

    {/* Recent history */}
    {history.length>0&&<div className="card" style={{padding:20}}>
      <h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>📈 Recent Results</h3>
      <table className="table">
        <thead><tr>
          <th>Test</th><th>Score</th><th>Accuracy</th><th>Date</th>
        </tr></thead>
        <tbody>
          {history.slice(-5).reverse().map((h,i)=><tr key={i}>
            <td style={{fontWeight:600}}>{h.testName}</td>
            <td><span style={{color:h.score>=60?"var(--green)":"var(--red)",fontWeight:700}}>{h.score}%</span></td>
            <td>{h.accuracy}%</td>
            <td style={{color:"var(--muted)",fontSize:13}}>{new Date(h.date).toLocaleDateString()}</td>
          </tr>)}
        </tbody>
      </table>
    </div>}
  </div>;
}

// PAGE: PRACTICE MCQs
// ══════════════════════════════════════════════════════════
function PracticePage() {
  const [filter,setFilter] = useState({topic:"All",difficulty:"All",chapter:"All"});
  const [current,setCurrent] = useState(null);
  const [selected,setSelected] = useState(null);
  const [revealed,setRevealed] = useState(false);
  const [score,setScore] = useState({correct:0,wrong:0});

  const topics = ["All",...new Set(SAMPLE_MCQS.map(q=>q.topic))];
  const difficulties = ["All","Easy","Medium","Hard"];

  const filtered = SAMPLE_MCQS.filter(q=>
    (filter.topic==="All"||q.topic===filter.topic) &&
    (filter.difficulty==="All"||q.difficulty===filter.difficulty)
  );

  const pickRandom = () => {
    const pool = filtered.filter(q=>!current||q.id!==current.id);
    if(!pool.length) return;
    setCurrent(pool[Math.floor(Math.random()*pool.length)]);
    setSelected(null); setRevealed(false);
  };

  useEffect(()=>{ if(filtered.length) pickRandom(); },[filter]);

  const submit = () => {
    if(selected===null) return;
    setRevealed(true);
    if(selected===current.correct) setScore(s=>({...s,correct:s.correct+1}));
    else setScore(s=>({...s,wrong:s.wrong+1}));
  };

  return <div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:800}}>Practice MCQs</h1>
        <p style={{fontSize:13,color:"var(--muted)"}}>Randomised questions from all books</p>
      </div>
      <div style={{display:"flex",gap:12}}>
        <div className="card" style={{padding:"10px 16px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:800,color:"var(--green)"}}>{score.correct}</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>Correct</div>
        </div>
        <div className="card" style={{padding:"10px 16px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:800,color:"var(--red)"}}>{score.wrong}</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>Wrong</div>
        </div>
        <div className="card" style={{padding:"10px 16px",textAlign:"center"}}>
          <div style={{fontSize:20,fontWeight:800,color:"var(--accent2)"}}>{score.correct+score.wrong>0?Math.round(score.correct/(score.correct+score.wrong)*100):0}%</div>
          <div style={{fontSize:11,color:"var(--muted)"}}>Accuracy</div>
        </div>
      </div>
    </div>

    {/* Filters */}
    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
      {[{k:"topic",opts:topics},{k:"difficulty",opts:difficulties}].map(({k,opts})=>(
        <div key={k} style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:12,color:"var(--muted)",fontWeight:600,textTransform:"uppercase"}}>{k}:</span>
          {opts.map(o=><button key={o} onClick={()=>setFilter(f=>({...f,[k]:o}))}
            className={`badge ${filter[k]===o?"":"btn-ghost"}`}
            style={{background:filter[k]===o?"var(--accent)":"var(--surface2)",color:filter[k]===o?"#fff":"var(--muted)",
              border:`1px solid ${filter[k]===o?"var(--accent)":"var(--border)"}`,cursor:"pointer",
              padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:600}}>
            {o}
          </button>)}
        </div>
      ))}
    </div>

    {current ? <div style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20}}>
      {/* Question card */}
      <div className="card" style={{padding:28}}>
        <div style={{display:"flex",gap:8,marginBottom:18}}>
          <span className={`badge tag-${current.difficulty.toLowerCase()}`}>{current.difficulty}</span>
          <span className="badge" style={{background:"rgba(6,182,212,.1)",color:"var(--accent3)",border:"1px solid rgba(6,182,212,.2)"}}>{current.topic}</span>
          <span className="badge" style={{background:"var(--surface2)",color:"var(--muted)"}}>{current.chapter}</span>
        </div>
        <p style={{fontSize:17,fontWeight:600,lineHeight:1.6,marginBottom:24}}>{current.question}</p>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {current.options.map((opt,i)=>{
            let cls="";
            if(revealed) {
              if(i===current.correct) cls=" correct";
              else if(i===selected&&i!==current.correct) cls=" wrong";
            } else if(i===selected) cls=" selected";
            return <div key={i} className={`q-option${cls}`} onClick={()=>!revealed&&setSelected(i)}>
              <div style={{width:28,height:28,borderRadius:8,background:
                revealed&&i===current.correct?"var(--green)":revealed&&i===selected&&i!==current.correct?"var(--red)":
                i===selected?"var(--accent)":"var(--surface2)",
                color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>
                {String.fromCharCode(65+i)}
              </div>
              <span style={{fontSize:15}}>{opt}</span>
              {revealed&&i===current.correct&&<span style={{marginLeft:"auto",color:"var(--green)"}}>✓</span>}
              {revealed&&i===selected&&i!==current.correct&&<span style={{marginLeft:"auto",color:"var(--red)"}}>✗</span>}
            </div>;
          })}
        </div>
        <div style={{display:"flex",gap:10,marginTop:20}}>
          {!revealed
            ? <button className="btn btn-primary" onClick={submit} disabled={selected===null} style={{flex:1}}>
                Check Answer
              </button>
            : <button className="btn btn-primary" onClick={pickRandom} style={{flex:1}}>
                Next Question →
              </button>
          }
          <button className="btn btn-secondary" onClick={pickRandom}>Skip</button>
        </div>

        {revealed&&<div style={{marginTop:20,padding:16,borderRadius:12,background:"rgba(124,58,237,.1)",border:"1px solid rgba(124,58,237,.2)"}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--accent2)",marginBottom:6}}>💡 Explanation</div>
          <p style={{fontSize:14,color:"var(--text)",lineHeight:1.6}}>{current.explanation}</p>
          <div style={{marginTop:8,display:"flex",gap:8}}>
            <span className="badge" style={{background:"rgba(6,182,212,.1)",color:"var(--accent3)",border:"1px solid rgba(6,182,212,.2)"}}>📚 {current.concept}</span>
          </div>
        </div>}
      </div>

      {/* MCQ info sidebar */}
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div className="card" style={{padding:18}}>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:12}}>📚 MCQ Bank Stats</h3>
          {[{l:"Total MCQs",v:SAMPLE_MCQS.length},{l:"Topics",v:topics.length-1},{l:"Your Filter",v:filtered.length+" MCQs"}].map(s=>(
            <div key={s.l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)",fontSize:14}}>
              <span style={{color:"var(--muted)"}}>{s.l}</span>
              <span style={{fontWeight:700}}>{s.v}</span>
            </div>
          ))}
        </div>
        <div className="card" style={{padding:18}}>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:12}}>🎯 Session Stats</h3>
          <div style={{display:"flex",justifyContent:"center"}}>
            <DonutChart pct={score.correct+score.wrong>0?Math.round(score.correct/(score.correct+score.wrong)*100):0} color="var(--accent2)" label="Accuracy"/>
          </div>
        </div>
      </div>
    </div> : <div className="card" style={{padding:40,textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>🎯</div>
      <p style={{color:"var(--muted)"}}>No questions match your filter</p>
    </div>}
  </div>;
}

// ══════════════════════════════════════════════════════════
// PAGE: EXAM INTERFACE (Core test taking)
// ══════════════════════════════════════════════════════════
function ExamPage() {
  const {activeTest,navigate,setTestResult,darkMode} = useApp();
  const [started,setStarted] = useState(false);
  const [current,setCurrent] = useState(0);
  const [answers,setAnswers] = useState({});
  const [marked,setMarked] = useState(new Set());
  const [timeLeft,setTimeLeft] = useState(0);
  const [warn,setWarn] = useState(false);
  const [warnShown,setWarnShown] = useState(false);
  const [confirmSub,setConfirmSub] = useState(false);
  const [showPalette,setShowPalette] = useState(false);
  const timerRef = useRef(null);

  const test = activeTest||generateTests()[0];
  const qs = test.questions||[];
  const total = qs.length;

  useEffect(()=>{ setTimeLeft(test.duration*60); },[test]);

  const doSubmit = useCallback(()=>{
    clearInterval(timerRef.current);
    let correct=0,wrong=0,skipped=0;
    const tmap={};
    qs.forEach((q,i)=>{
      const a=answers[i];
      if(!tmap[q.topic]) tmap[q.topic]={c:0,t:0};
      tmap[q.topic].t++;
      if(a===undefined) skipped++;
      else if(a===q.correct){correct++;tmap[q.topic].c++;}
      else wrong++;
    });
    const score=Math.round((correct/total)*100);
    const accuracy=Math.round((correct/(correct+wrong||1))*100);
    const weakTopics=Object.entries(tmap).map(([name,d])=>({name,correct:d.c,total:d.t,accuracy:Math.round((d.c/d.t)*100)}));
    const result={testId:test.id,testName:test.name,date:new Date().toISOString(),
      totalQuestions:total,answers,timeTaken:(test.duration*60)-timeLeft,
      correct,wrong,skipped,score,accuracy,weakTopics};
    setTestResult(result);
    const h=JSON.parse(localStorage.getItem("eiq_history")||"[]");
    h.push(result);
    localStorage.setItem("eiq_history",JSON.stringify(h));
    navigate("result");
  },[answers,qs,total,test,timeLeft,navigate,setTestResult]);

  useEffect(()=>{
    if(!started) return;
    timerRef.current=setInterval(()=>{
      setTimeLeft(p=>{
        if(p<=1){clearInterval(timerRef.current);doSubmit();return 0;}
        if(p===300&&!warnShown){setWarn(true);setWarnShown(true);}
        return p-1;
      });
    },1000);
    return()=>clearInterval(timerRef.current);
  },[started,doSubmit,warnShown]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

  const qStatus=i=>{
    if(marked.has(i)&&answers[i]!==undefined) return "marked-answered";
    if(marked.has(i)) return "marked";
    if(answers[i]!==undefined) return "answered";
    if(i<current) return "visited";
    return "not-visited";
  };

  const paletteClass=i=>{
    const s=qStatus(i);
    if(s==="answered") return "p-answered";
    if(s==="marked") return "p-marked";
    if(s==="marked-answered") return "p-marked-answered";
    if(s==="visited") return "p-visited";
    return "p-not-visited";
  };

  const q=qs[current];
  const answered=Object.keys(answers).length;
  const crit=timeLeft<300;

  if(!started) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"calc(100vh - 60px)"}}>
      <div className="card" style={{maxWidth:500,width:"100%",padding:40,textAlign:"center"}}>
        <div style={{width:60,height:60,borderRadius:16,background:"linear-gradient(135deg,#7c3aed,#06b6d4)",
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 20px"}}>🎯</div>
        <h1 style={{fontSize:22,fontWeight:800,marginBottom:6}}>{test.name}</h1>
        <p style={{color:"var(--muted)",fontSize:14,marginBottom:28}}>{test.subject} · {test.year}</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:28}}>
          {[{i:"❓",l:"Questions",v:total},{i:"⏱️",l:"Duration",v:`${test.duration} min`},{i:"🏆",l:"Marking",v:"+1 / 0"}].map(s=>(
            <div key={s.l} style={{padding:14,borderRadius:12,background:"var(--surface2)"}}>
              <div style={{fontSize:22,marginBottom:4}}>{s.i}</div>
              <div style={{fontSize:17,fontWeight:800}}>{s.v}</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:"left",padding:16,borderRadius:12,background:"var(--surface2)",marginBottom:24}}>
          <p style={{fontSize:13,fontWeight:700,marginBottom:8}}>📋 Instructions</p>
          {["Each question carries 1 mark. No negative marking.",
            "Use Mark for Review to flag questions for later.",
            "Green palette = answered, Orange = marked, Red = visited unanswered.",
            "Test auto-submits when timer hits 00:00."].map((t,i)=>(
            <p key={i} style={{fontSize:12,color:"var(--muted)",marginBottom:4}}>• {t}</p>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-secondary" onClick={()=>navigate("tests")} style={{flex:"0 0 auto"}}>← Back</button>
          <button className="btn btn-primary" onClick={()=>setStarted(true)} style={{flex:1,fontSize:15}}>🚀 Begin Test</button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"calc(100vh - 60px)"}}>
      {/* Exam topbar */}
      <div style={{background:"var(--surface)",borderBottom:"1px solid var(--border)",padding:"10px 20px",
        display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,flexShrink:0}}>
        <div>
          <p style={{fontWeight:700,fontSize:14}}>{test.name}</p>
          <p style={{fontSize:12,color:"var(--muted)"}}>Q {current+1} / {total}</p>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",borderRadius:12,
          background:crit?"rgba(239,68,68,.15)":"var(--surface2)",
          color:crit?"var(--red)":"var(--text)",fontWeight:800,fontSize:20,fontFamily:"JetBrains Mono,monospace",
          border:`1px solid ${crit?"var(--red)":"var(--border)"}`,
          animation:crit?"pulse 1s infinite":undefined}}>
          ⏱ {fmt(timeLeft)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <div style={{fontSize:12,color:"var(--muted)",display:"flex",gap:12}}>
            <span>✅ <strong style={{color:"var(--green)"}}>{answered}</strong></span>
            <span>⏭ <strong style={{color:"var(--red)"}}>{total-answered}</strong></span>
            <span>🚩 <strong style={{color:"var(--orange)"}}>{marked.size}</strong></span>
          </div>
          <button className="btn btn-secondary" onClick={()=>setShowPalette(p=>!p)} style={{fontSize:12,padding:"6px 10px"}}>Grid</button>
          <button className="btn btn-success" onClick={()=>setConfirmSub(true)} style={{fontSize:12,padding:"6px 14px"}}>Submit ✓</button>
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Question area */}
        <div style={{flex:1,padding:24,overflowY:"auto"}}>
          {q&&<div style={{maxWidth:720}}>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <span className="badge" style={{background:"rgba(124,58,237,.15)",color:"var(--accent2)",border:"1px solid rgba(124,58,237,.25)"}}>{q.topic}</span>
              <span className={`badge tag-${q.difficulty.toLowerCase()}`}>{q.difficulty}</span>
              <span style={{marginLeft:"auto",fontSize:12,color:"var(--muted)"}}>Chapter: {q.chapter}</span>
            </div>
            <div className="card" style={{padding:22,marginBottom:20}}>
              <p style={{fontSize:17,fontWeight:600,lineHeight:1.7}}>{q.question}</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {q.options.map((opt,i)=><div key={i} className={`q-option${answers[current]===i?" selected":""}`}
                onClick={()=>setAnswers({...answers,[current]:i})}>
                <div style={{width:30,height:30,borderRadius:8,
                  background:answers[current]===i?"var(--accent)":"var(--surface2)",
                  color:answers[current]===i?"#fff":"var(--muted)",
                  display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>
                  {String.fromCharCode(65+i)}
                </div>
                <span style={{fontSize:15}}>{opt}</span>
              </div>)}
            </div>
            <div style={{display:"flex",gap:10,marginTop:20,alignItems:"center"}}>
              <button className="btn btn-secondary" onClick={()=>setCurrent(Math.max(0,current-1))} disabled={current===0}>← Prev</button>
              <button className={`btn ${marked.has(current)?"btn-danger":"btn-secondary"}`}
                onClick={()=>{const m=new Set(marked);m.has(current)?m.delete(current):m.add(current);setMarked(m);}}>
                🚩 {marked.has(current)?"Unmark":"Mark Review"}
              </button>
              <button className="btn btn-secondary"
                onClick={()=>{const a={...answers};delete a[current];setAnswers(a);}}>Clear</button>
              <button className="btn btn-primary" style={{marginLeft:"auto"}}
                onClick={()=>current<total-1?setCurrent(current+1):setConfirmSub(true)}>
                {current<total-1?"Next →":"Submit ✓"}
              </button>
            </div>
          </div>}
        </div>

        {/* Palette - desktop */}
        <div style={{width:220,borderLeft:"1px solid var(--border)",padding:16,overflowY:"auto",background:"var(--surface)"}}>
          <p style={{fontSize:13,fontWeight:700,marginBottom:14}}>Question Palette</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:14}}>
            {qs.map((_,i)=><button key={i} className={`palette-btn ${paletteClass(i)}`}
              onClick={()=>setCurrent(i)}
              style={{outline:i===current?"2px solid var(--accent2)":undefined,outlineOffset:2}}>
              {i+1}
            </button>)}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,fontSize:11}}>
            {[{c:"var(--green)",l:"Answered"},{c:"var(--red)",l:"Not Answered"},{c:"var(--orange)",l:"Marked"},{c:"var(--accent)",l:"Marked+Ans"}].map(x=>(
              <div key={x.l} style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:10,height:10,borderRadius:2,background:x.c,flexShrink:0}}/>
                <span style={{color:"var(--muted)"}}>{x.l}</span>
              </div>
            ))}
          </div>
          <div style={{marginTop:14,padding:12,borderRadius:10,background:"var(--surface2)",fontSize:12}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{color:"var(--muted)"}}>Answered</span><strong style={{color:"var(--green)"}}>{answered}</strong>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{color:"var(--muted)"}}>Remaining</span><strong style={{color:"var(--red)"}}>{total-answered}</strong>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <span style={{color:"var(--muted)"}}>Marked</span><strong style={{color:"var(--orange)"}}>{marked.size}</strong>
            </div>
          </div>
        </div>
      </div>

      {/* Modals */}
      {warn&&<div className="overlay"><div className="modal" style={{textAlign:"center",maxWidth:360}}>
        <div style={{fontSize:48,marginBottom:12}}>⚠️</div>
        <h2 style={{fontSize:20,fontWeight:800,marginBottom:8}}>5 Minutes Remaining!</h2>
        <p style={{color:"var(--muted)",marginBottom:20}}>Please review and submit your answers soon.</p>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={()=>setWarn(false)}>Continue Exam</button>
      </div></div>}

      {confirmSub&&<div className="overlay"><div className="modal">
        <h2 style={{fontSize:18,fontWeight:800,marginBottom:20}}>📋 Confirm Submission</h2>
        {[{l:"Total Questions",v:total},{l:"Answered",v:answered,c:"var(--green)"},{l:"Not Answered",v:total-answered,c:"var(--red)"},{l:"Marked for Review",v:marked.size,c:"var(--orange)"}].map(s=>(
          <div key={s.l} style={{display:"flex",justifyContent:"space-between",padding:"10px 14px",borderRadius:10,
            background:"var(--surface2)",marginBottom:8}}>
            <span style={{fontSize:14,color:"var(--muted)"}}>{s.l}</span>
            <strong style={{color:s.c||"var(--text)"}}>{s.v}</strong>
          </div>
        ))}
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setConfirmSub(false)}>Cancel</button>
          <button className="btn btn-success" style={{flex:1}} onClick={doSubmit}>Submit ✓</button>
        </div>
      </div></div>}

      {showPalette&&<div className="overlay" onClick={()=>setShowPalette(false)}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          <h3 style={{fontWeight:700,marginBottom:14}}>Question Palette</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:6}}>
            {qs.map((_,i)=><button key={i} className={`palette-btn ${paletteClass(i)}`}
              onClick={()=>{setCurrent(i);setShowPalette(false);}}>
              {i+1}
            </button>)}
          </div>
        </div>
      </div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// PAGE: RESULT
// ══════════════════════════════════════════════════════════
function ResultPage() {
  const {testResult,activeTest,navigate} = useApp();
  const [tab,setTab] = useState("summary");
  const tests = generateTests();
  if(!testResult) return <div style={{textAlign:"center",padding:60}}>
    <div style={{fontSize:48,marginBottom:12}}>📊</div>
    <p style={{color:"var(--muted)",marginBottom:16}}>No result data found</p>
    <button className="btn btn-primary" onClick={()=>navigate("dashboard")}>Back to Dashboard</button>
  </div>;

  const {correct,wrong,skipped,score,accuracy,totalQuestions,weakTopics,timeTaken,testName,answers}=testResult;
  const test=activeTest||tests[0];
  const qs=test?.questions||[];
  const fmt=s=>`${Math.floor(s/60)}m ${s%60}s`;
  const grade=score>=90?{l:"Excellent! 🏆",c:"var(--green)"}:score>=75?{l:"Very Good 🌟",c:"var(--accent2)"}:score>=60?{l:"Good 👍",c:"var(--accent3)"}:score>=40?{l:"Average 📈",c:"var(--yellow)"}:{l:"Keep Trying 💪",c:"var(--red)"};
  const pColor=a=>a>=70?"var(--green)":a>=50?"var(--yellow)":"var(--red)";

  const exportTxt=()=>{
    const c=`ExamIQ — Test Result\n${"=".repeat(40)}\nTest: ${testName}\nDate: ${new Date(testResult.date).toLocaleString()}\n\nSCORE: ${score}%\nCorrect: ${correct}/${totalQuestions}\nWrong: ${wrong}\nSkipped: ${skipped}\nAccuracy: ${accuracy}%\nTime: ${fmt(timeTaken||0)}\n\nSUBJECT ANALYSIS\n${(weakTopics||[]).map(t=>`${t.name}: ${t.accuracy}% (${t.correct}/${t.total})`).join('\n')}`;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([c],{type:"text/plain"}));
    a.download=`result-${testName?.replace(/\s+/g,"-")}.txt`;a.click();
  };

  return <div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeUp .4s ease"}}>
    <div style={{textAlign:"center",padding:"24px 0"}}>
      <div style={{fontSize:52,marginBottom:10}}>🏁</div>
      <h1 style={{fontSize:26,fontWeight:800,marginBottom:4}}>Test Complete</h1>
      <p style={{color:"var(--muted)",fontSize:14,marginBottom:10}}>{testName}</p>
      <span style={{padding:"6px 18px",borderRadius:20,fontSize:14,fontWeight:700,
        background:`${grade.c}20`,color:grade.c,border:`1px solid ${grade.c}40`}}>{grade.l}</span>
    </div>

    {/* Score row */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14}}>
      {[{l:"Score",v:`${score}%`,i:"⭐",c:"#7c3aed"},{l:"Correct",v:correct,i:"✅",c:"#10b981"},
        {l:"Wrong",v:wrong,i:"❌",c:"#ef4444"},{l:"Skipped",v:skipped,i:"⏭️",c:"#f97316"}].map(s=>(
        <div key={s.l} className="stat-card" style={{textAlign:"center",padding:20}}>
          <div style={{fontSize:28,marginBottom:6}}>{s.i}</div>
          <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>
          <div style={{fontSize:12,color:"var(--muted)"}}>{s.l}</div>
        </div>
      ))}
    </div>

    {/* Tabs */}
    <div style={{display:"flex",gap:4,background:"var(--surface2)",padding:4,borderRadius:14,width:"fit-content"}}>
      {[{k:"summary",l:"📊 Summary"},{k:"analysis",l:"🔍 Analysis"},{k:"answers",l:"📝 Answers"}].map(t=>(
        <button key={t.k} onClick={()=>setTab(t.k)} style={{
          padding:"8px 18px",borderRadius:11,fontSize:13,fontWeight:700,border:"none",cursor:"pointer",
          background:tab===t.k?"var(--surface)":"transparent",color:tab===t.k?"var(--accent2)":"var(--muted)"}}>
          {t.l}
        </button>
      ))}
    </div>

    {tab==="summary"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <div className="card" style={{padding:24}}>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:16}}>Performance Overview</h3>
        <div style={{display:"flex",justifyContent:"space-around"}}>
          <DonutChart pct={score} color="#7c3aed" size={110} label="Score"/>
          <DonutChart pct={accuracy} color="#10b981" size={110} label="Accuracy"/>
        </div>
      </div>
      <div className="card" style={{padding:24}}>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>Test Details</h3>
        {[{l:"Total Questions",v:totalQuestions},{l:"Correct",v:correct,c:"var(--green)"},{l:"Wrong",v:wrong,c:"var(--red)"},
          {l:"Skipped",v:skipped,c:"var(--orange)"},{l:"Accuracy",v:`${accuracy}%`,c:"var(--accent2)"},{l:"Time Taken",v:fmt(timeTaken||0)}].map(d=>(
          <div key={d.l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
            <span style={{fontSize:13,color:"var(--muted)"}}>{d.l}</span>
            <strong style={{color:d.c||"var(--text)"}}>{d.v}</strong>
          </div>
        ))}
      </div>
    </div>}

    {tab==="analysis"&&<div className="card" style={{padding:24}}>
      <h3 style={{fontSize:15,fontWeight:700,marginBottom:20}}>Chapter / Topic Analysis</h3>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {(weakTopics||[]).sort((a,b)=>a.accuracy-b.accuracy).map(t=>(
          <div key={t.name}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <div>
                <span style={{fontWeight:600}}>{t.name}</span>
                <span style={{fontSize:12,color:"var(--muted)",marginLeft:8}}>({t.correct}/{t.total})</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:13,fontWeight:700,color:pColor(t.accuracy)}}>{t.accuracy}%</span>
                <span>{t.accuracy>=70?"💪":t.accuracy>=50?"📈":"⚠️"}</span>
              </div>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{width:`${t.accuracy}%`,background:pColor(t.accuracy)}}/>
            </div>
          </div>
        ))}
      </div>

function AdminUpload() {
  const {navigate,setToast} = useApp();
  const [stage,setStage] = useState("upload");
  const [file,setFile] = useState(null);
  const [drag,setDrag] = useState(false);
  const [settings,setSettings] = useState({title:"",subject:"General Studies",numMcqs:100,difficulty:"All",chunkSize:500,year:"2024"});
  const [progress,setProgress] = useState(0);
  const [progText,setProgText] = useState("");
  const [generated,setGenerated] = useState(null);
  const [useAI,setUseAI] = useState(true);

  const handleFile = f => {
    const exts=[".pdf",".docx",".txt"];
    const ok=exts.some(e=>f.name.toLowerCase().endsWith(e));
    if(!ok){setToast({msg:"Only PDF, DOCX, TXT supported",type:"error"});return;}
    setFile(f);
    setSettings(s=>({...s,title:f.name.replace(/\.(pdf|docx|txt)$/i,"")}));
    setStage("settings");
  };

  const process = async () => {
    setStage("processing");
    const steps=[
      {p:5,t:"📂 Reading file..."},
      {p:15,t:"📄 Extracting text content..."},
      {p:30,t:"🔍 Detecting chapters & topics..."},
      {p:45,t:"🤖 Sending to Claude AI..."},
      {p:60,t:"✨ Generating MCQs..."},
      {p:75,t:"🏷️ Tagging by chapter & difficulty..."},
      {p:88,t:"✅ Validating answers..."},
      {p:95,t:"📊 Creating test bank..."},
      {p:100,t:"🎉 Done!"},
    ];
    for(const s of steps){
      setProgText(s.t);setProgress(s.p);
      await new Promise(r=>setTimeout(r,500+Math.random()*300));
    }

    // Try real AI
    let qs=[];
    if(useAI){
      try{
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",max_tokens:1000,
            messages:[{role:"user",content:`Generate 10 high-quality MCQs for a competitive exam (TNPSC/UPSC style) from the subject: "${settings.subject}". 
Return ONLY valid JSON array, no markdown:
[{"id":1,"topic":"${settings.subject}","chapter":"Chapter Name","difficulty":"Medium","question":"...?","options":["A","B","C","D"],"correct":0,"explanation":"...","concept":"..."}]
correct = 0-indexed integer.`}]
          })
        });
        if(res.ok){const d=await res.json();const raw=d.content?.[0]?.text||"[]";qs=JSON.parse(raw.replace(/```json|```/g,"").trim());}
      }catch(e){}
    }
    if(!qs.length){
      qs=SAMPLE_MCQS.filter(q=>settings.subject==="All"||q.topic.toLowerCase().includes(settings.subject.toLowerCase().slice(0,4)));
      if(!qs.length) qs=[...SAMPLE_MCQS].sort(()=>Math.random()-.5).slice(0,settings.numMcqs);
    }

    const result={
      id:Date.now(),title:settings.title,subject:settings.subject,
      totalMcqs:qs.length,chapters:[...new Set(qs.map(q=>q.chapter||"General"))].length,
      difficulty:settings.difficulty,mcqs:qs,
    };
    setGenerated(result);
    // Save to test bank
    const banks=JSON.parse(localStorage.getItem("eiq_banks")||"[]");
    banks.push(result);
    localStorage.setItem("eiq_banks",JSON.stringify(banks));
    setStage("done");
  };

  const subjects=["General Studies","Tamil","History","Geography","Science","Polity","Economics","English","Mathematics"];
  const stIdx=["upload","settings","processing","done"].indexOf(stage);

  return <div style={{maxWidth:700,animation:"fadeUp .4s ease"}}>
    <div style={{marginBottom:24}}>
      <h1 style={{fontSize:22,fontWeight:800}}>Upload Book / PDF</h1>
      <p style={{fontSize:13,color:"var(--muted)"}}>AI will extract text and generate thousands of MCQs automatically</p>
    </div>

    {/* Steps */}
    <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:28}}>
      {["Upload","Settings","Processing","Done"].map((s,i)=>(
        <React.Fragment key={s}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:13,fontWeight:700,transition:"all .3s",
              background:i===stIdx?"var(--accent)":stIdx>i?"var(--green)":"var(--surface2)",
              color:i===stIdx||stIdx>i?"#fff":"var(--muted)"}}>
              {stIdx>i?"✓":i+1}
            </div>
            <span style={{fontSize:13,fontWeight:stIdx===i?700:400,color:stIdx===i?"var(--text)":"var(--muted)"}}>{s}</span>
          </div>
          {i<3&&<div style={{flex:1,height:2,margin:"0 8px",background:stIdx>i?"var(--green)":"var(--surface2)",transition:"all .3s"}}/>}
        </React.Fragment>
      ))}
    </div>

    {stage==="upload"&&<div
      className={`upload-zone ${drag?"drag":""}`}
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}
      onClick={()=>document.getElementById("fup").click()}>
      <input id="fup" type="file" accept=".pdf,.docx,.txt" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
      <div style={{fontSize:52,marginBottom:16}}>📁</div>
      <h3 style={{fontSize:18,fontWeight:700,marginBottom:8}}>Drop file here or click to browse</h3>
      <p style={{color:"var(--muted)",fontSize:14,marginBottom:20}}>Previous year papers, textbooks, notes</p>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:20}}>
        {["PDF","DOCX","TXT"].map(f=><span key={f} className="badge" style={{background:"var(--surface2)",color:"var(--muted)",border:"1px solid var(--border)"}}>{f}</span>)}
      </div>
      <button className="btn btn-primary" style={{fontSize:14}}>Browse Files</button>
      <p style={{fontSize:12,color:"var(--muted)",marginTop:12}}>Max file size: 50MB</p>
    </div>}

    {stage==="settings"&&<div className="card" style={{padding:28}}>
      <div style={{display:"flex",gap:10,padding:14,borderRadius:12,background:"rgba(16,185,129,.1)",border:"1px solid rgba(16,185,129,.3)",marginBottom:24}}>
        <span style={{fontSize:20}}>✅</span>
        <div><p style={{fontWeight:700,color:"var(--green)"}}>{file?.name}</p>
          <p style={{fontSize:12,color:"var(--muted)"}}>{(file?.size/1024).toFixed(1)} KB • {file?.name.split(".").pop().toUpperCase()}</p></div>
      </div>
      <h2 style={{fontSize:16,fontWeight:700,marginBottom:20}}>Configure MCQ Generation</h2>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div style={{gridColumn:"1/-1"}}>
          <label className="label">Book / Test Title</label>
          <input className="input" value={settings.title} onChange={e=>setSettings({...settings,title:e.target.value})} placeholder="e.g. TNPSC Group 1 Study Material"/>
        </div>
        {[
          {l:"Subject",k:"subject",type:"select",opts:subjects},
          {l:"Difficulty",k:"difficulty",type:"select",opts:["All","Easy","Medium","Hard"]},
          {l:"Number of MCQs to Generate",k:"numMcqs",type:"number",min:10,max:10000},
          {l:"Year",k:"year",type:"text"},
        ].map(f=><div key={f.k}>
          <label className="label">{f.l}</label>
          {f.type==="select"
            ?<select className="input" value={settings[f.k]} onChange={e=>setSettings({...settings,[f.k]:e.target.value})}>
              {f.opts.map(o=><option key={o}>{o}</option>)}
            </select>
            :<input className="input" type={f.type} value={settings[f.k]} min={f.min} max={f.max}
              onChange={e=>setSettings({...settings,[f.k]:f.type==="number"?parseInt(e.target.value):e.target.value})}/>
          }
        </div>)}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:12,marginTop:16,padding:14,borderRadius:12,background:"rgba(124,58,237,.08)"}}>
        <label style={{position:"relative",display:"inline-block",width:44,height:24,cursor:"pointer"}}>
          <input type="checkbox" checked={useAI} onChange={e=>setUseAI(e.target.checked)} style={{opacity:0,width:0,height:0}}/>
          <div style={{position:"absolute",inset:0,background:useAI?"var(--accent)":"var(--surface2)",borderRadius:12,transition:"all .3s"}}>
            <div style={{position:"absolute",top:2,left:useAI?22:2,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left .3s"}}/>
          </div>
        </label>
        <div>
          <p style={{fontSize:14,fontWeight:700,color:"var(--accent2)"}}>🤖 Use Claude AI</p>
          <p style={{fontSize:12,color:"var(--muted)"}}>Generates high-quality MCQs with explanations from content</p>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:20}}>
        <button className="btn btn-secondary" onClick={()=>setStage("upload")}>← Back</button>
        <button className="btn btn-primary" style={{flex:1}} onClick={process}>🚀 Generate {settings.numMcqs} MCQs</button>
      </div>
    </div>}

    {stage==="processing"&&<div className="card" style={{padding:52,textAlign:"center"}}>
      <div style={{width:70,height:70,borderRadius:20,background:"linear-gradient(135deg,var(--accent),var(--accent3))",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 24px",
        animation:"glow 2s infinite"}}>🤖</div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:8}}>AI Processing...</h2>
      <p style={{color:"var(--muted)",marginBottom:28,fontSize:14}}>{progText}</p>
      <div className="progress-bar" style={{height:10,marginBottom:12}}>
        <div className="progress-fill" style={{width:`${progress}%`,background:"linear-gradient(90deg,var(--accent),var(--accent3))"}}/>
      </div>
      <p className="mono" style={{color:"var(--accent2)",fontWeight:600}}>{progress}%</p>
      <p style={{fontSize:12,color:"var(--muted)",marginTop:12}}>Generating MCQs from {file?.name}...</p>
    </div>}

    {stage==="done"&&generated&&<div className="card" style={{padding:40,textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:16}}>🎉</div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:8}}>MCQ Bank Created!</h2>
      <p style={{color:"var(--muted)",marginBottom:28,fontSize:14}}>Ready for students to practice</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:28}}>
        {[{i:"🧩",l:"MCQs Generated",v:generated.totalMcqs},{i:"📖",l:"Chapters",v:generated.chapters},{i:"📚",l:"Subject",v:generated.subject}].map(s=>(
          <div key={s.l} style={{padding:16,borderRadius:14,background:"var(--surface2)"}}>
            <div style={{fontSize:24,marginBottom:4}}>{s.i}</div>
            <div style={{fontWeight:800,color:"var(--accent2)",fontSize:16}}>{s.v}</div>
            <div style={{fontSize:11,color:"var(--muted)"}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <button className="btn btn-secondary" onClick={()=>{setStage("upload");setFile(null);setGenerated(null);setProgress(0);}}>Upload Another</button>
        <button className="btn btn-primary" onClick={()=>navigate("admin-mcqs")}>View MCQ Bank →</button>
      </div>
    </div>}
  </div>;
}

function AdminMCQs() {
  const [filter,setFilter] = useState({topic:"All",diff:"All",search:""});
  const [selected,setSelected] = useState(new Set());

  const banks=JSON.parse(localStorage.getItem("eiq_banks")||"[]");
  const allMcqs=[...SAMPLE_MCQS,...banks.flatMap(b=>b.mcqs||[])];

  const topics=["All",...new Set(allMcqs.map(q=>q.topic))];
  const diffs=["All","Easy","Medium","Hard"];

  const filtered=allMcqs.filter(q=>
    (filter.topic==="All"||q.topic===filter.topic)&&
    (filter.diff==="All"||q.difficulty===filter.diff)&&
    (!filter.search||q.question.toLowerCase().includes(filter.search.toLowerCase()))
  );

  return <div style={{display:"flex",flexDirection:"column",gap:16,animation:"fadeUp .4s ease"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:800}}>MCQ Bank</h1>
        <p style={{fontSize:13,color:"var(--muted)"}}>{allMcqs.length} total MCQs • {filtered.length} filtered</p>
      </div>
      <div style={{display:"flex",gap:8}}>
        {selected.size>0&&<button className="btn btn-primary" style={{fontSize:13}}>Create Test from {selected.size} selected</button>}
        <button className="btn btn-secondary" style={{fontSize:13}}>Export CSV</button>
      </div>
    </div>

    {/* Filters */}
    <div className="card" style={{padding:16,display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
      <input className="input" style={{maxWidth:220}} placeholder="Search questions..." value={filter.search} onChange={e=>setFilter(f=>({...f,search:e.target.value}))}/>
      <select className="input" style={{maxWidth:150}} value={filter.topic} onChange={e=>setFilter(f=>({...f,topic:e.target.value}))}>
        {topics.map(t=><option key={t}>{t}</option>)}
      </select>
      <select className="input" style={{maxWidth:130}} value={filter.diff} onChange={e=>setFilter(f=>({...f,diff:e.target.value}))}>
        {diffs.map(d=><option key={d}>{d}</option>)}
      </select>
      <span style={{fontSize:13,color:"var(--muted)",marginLeft:"auto"}}>{filtered.length} results</span>
    </div>

    {/* MCQ table */}
    <div className="card" style={{overflow:"hidden"}}>
      <table className="table">
        <thead><tr>
          <th><input type="checkbox" onChange={e=>{if(e.target.checked)setSelected(new Set(filtered.map(q=>q.id)));else setSelected(new Set());}}/></th>
          <th>#</th><th>Question</th><th>Topic</th><th>Chapter</th><th>Difficulty</th>
        </tr></thead>
        <tbody>
          {filtered.slice(0,50).map((q,i)=><tr key={q.id||i}>
            <td><input type="checkbox" checked={selected.has(q.id||i)} onChange={e=>{const s=new Set(selected);e.target.checked?s.add(q.id||i):s.delete(q.id||i);setSelected(s);}}/></td>
            <td style={{color:"var(--muted)",fontSize:13}}>{i+1}</td>
            <td style={{maxWidth:320}}>
              <p style={{fontWeight:500,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{q.question}</p>
              <p style={{fontSize:11,color:"var(--muted)",marginTop:2}}>✓ {q.options?.[q.correct]}</p>
            </td>
            <td><span className="badge" style={{background:"rgba(6,182,212,.1)",color:"var(--accent3)",border:"1px solid rgba(6,182,212,.2)"}}>{q.topic}</span></td>
            <td style={{fontSize:12,color:"var(--muted)"}}>{q.chapter}</td>
            <td><span className={`badge tag-${q.difficulty?.toLowerCase()||"medium"}`}>{q.difficulty}</span></td>
          </tr>)}
        </tbody>
      </table>
      {filtered.length>50&&<div style={{padding:"12px 20px",color:"var(--muted)",fontSize:13,borderTop:"1px solid var(--border)"}}>
        Showing 50 of {filtered.length} results
      </div>}
    </div>
  </div>;
}

function AdminTests() {
  const {navigate,setActiveTest} = useApp();
  const tests=generateTests();
  return <div style={{animation:"fadeUp .4s ease"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div><h1 style={{fontSize:22,fontWeight:800}}>Manage Tests</h1><p style={{fontSize:13,color:"var(--muted)"}}>Create and manage exam tests</p></div>
      <button className="btn btn-primary">+ Create Test</button>
    </div>
    <div className="card" style={{overflow:"hidden"}}>
      <table className="table">
        <thead><tr><th>Test Name</th><th>Subject</th><th>Questions</th><th>Duration</th><th>Difficulty</th><th>Attempts</th><th>Actions</th></tr></thead>
        <tbody>
          {tests.map(t=><tr key={t.id}>
            <td style={{fontWeight:600}}>{t.name}</td>
            <td style={{color:"var(--muted)"}}>{t.subject}</td>
            <td>{t.questions.length}</td>
            <td>{t.duration} min</td>
            <td><span className={`badge tag-${t.difficulty.toLowerCase()}`}>{t.difficulty}</span></td>
            <td>{t.totalAttempts.toLocaleString()}</td>
            <td><div style={{display:"flex",gap:6}}>
              <button className="btn btn-secondary" style={{fontSize:12,padding:"5px 10px"}} onClick={()=>{setActiveTest(t);navigate("exam");}}>Preview</button>
              <button className="btn btn-ghost" style={{fontSize:12,padding:"5px 10px",color:"var(--red)"}}>Delete</button>
            </div></td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

function AdminStudents() {
  return <div style={{animation:"fadeUp .4s ease"}}>
    <div style={{marginBottom:20}}><h1 style={{fontSize:22,fontWeight:800}}>Student Performance</h1><p style={{fontSize:13,color:"var(--muted)"}}>Monitor all student activity</p></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:20}}>
      {[{l:"Total Students",v:342,c:"#7c3aed"},{l:"Active Today",v:89,c:"#10b981"},{l:"Avg Score",v:"72%",c:"#06b6d4"}].map(s=>(
        <div key={s.l} className="stat-card" style={{padding:20}}>
          <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>
          <div style={{fontSize:13,color:"var(--muted)"}}>{s.l}</div>
        </div>
      ))}
    </div>
    <div className="card" style={{overflow:"hidden"}}>
      <table className="table">
        <thead><tr><th>Student</th><th>Tests Taken</th><th>Avg Score</th><th>Accuracy</th><th>Last Active</th><th>Status</th></tr></thead>
        <tbody>
          {MOCK_LEADERBOARD.map(s=><tr key={s.name}>
            <td><div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:28,height:28,borderRadius:7,background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{s.name[0]}</div>
              <span style={{fontWeight:600}}>{s.name}</span>
            </div></td>
            <td>{s.tests}</td>
            <td><span style={{color:s.score>=70?"var(--green)":"var(--yellow)",fontWeight:700}}>{s.score}%</span></td>
            <td>{s.accuracy}%</td>
            <td style={{color:"var(--muted)",fontSize:13}}>2 days ago</td>
            <td><span className="badge tag-easy">Active</span></td>
          </tr>)}
        </tbody>
      </table>
    </div>
  </div>;
}

// ══════════════════════════════════════════════════════════
// ROOT APP
// ══════════════════════════════════════════════════════════
function App() {
  const [page,setPage] = useState("login");
  const [user,setUser] = useState(null);
  const [darkMode,setDarkMode] = useState(true);
  const [activeTest,setActiveTest] = useState(null);
  const [testResult,setTestResult] = useState(null);
  const [toast,setToast] = useState(null);
  const [tests,setTests] = useState([]);

  useEffect(()=>{
    const u=localStorage.getItem("eiq_user");
    if(u){setUser(JSON.parse(u));setPage("dashboard");}
    const dm=localStorage.getItem("eiq_dark");
    if(dm!==null)setDarkMode(dm==="true");
  },[]);

  useEffect(()=>{
    document.documentElement.className=darkMode?"":"light";
    localStorage.setItem("eiq_dark",darkMode);
  },[darkMode]);

  const navigate=p=>setPage(p);

  const isExam=page==="exam";
  const isLogin=page==="login";
  const showSidebar=!isExam&&!isLogin&&user;

  const pageComponent=()=>{
    switch(page){
      case "login": return <LoginPage/>;
      case "dashboard": return <StudentDashboard/>;
      case "practice": return <PracticePage/>;
      case "tests": return <TestsPage/>;
      case "exam": return <ExamPage/>;
      case "result": return <ResultPage/>;
      case "analytics": return <AnalyticsPage/>;
      case "leaderboard": return <LeaderboardPage/>;
      case "admin-dashboard": return <AdminDashboard/>;
      case "admin-upload": return <AdminUpload/>;
      case "admin-mcqs": return <AdminMCQs/>;
      case "admin-tests": return <AdminTests/>;
      case "admin-students": return <AdminStudents/>;
      default: return <StudentDashboard/>;
    }
  };

  return <Ctx.Provider value={{user,setUser,darkMode,setDarkMode,page,navigate,activeTest,setActiveTest,testResult,setTestResult,tests,setTests,setToast}}>
    {!isLogin&&<NavBar/>}
    {isLogin
      ? pageComponent()
      : <div className="app-layout">
          {showSidebar&&!isExam&&<Sidebar/>}
          <div className="page-content">
            {pageComponent()}
          </div>
        </div>
    }
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
  </Ctx.Provider>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
